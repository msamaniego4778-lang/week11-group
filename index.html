Git vs Github

    Git is a version control system -> helps programmer:
    . track changes
    . save progreess
    . create checkpoints, logs (date and time and comment of what changed)

    Mac, Linux -> already installed
    Windows -> git-scm.com
    git config --global user.name "John Doe"
    git config --global user.email "@email.com"

    . ideally you want these to be the same as your id on github

    repo -> another name for folder
    staging -> files we set to be logged in the checkpoint

    green gutter -> line was added
    blue gutter -> line was changed
    red triangle -> line was deleted

    Github -> cloud platform of version contro software, collaborate with others
